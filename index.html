<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamified Learning Platform</title>
</head>
<body>
    <h1>Gamified Skill Progression</h1>
    
    <div>
        <p>Level: <span id="level">1</span></p>
        <p>XP: <span id="xp">0</span></p>
        <button id="completeQuest">Complete Quest</button>
    </div>

    <div class="quests">
        <h2>Available Quests</h2>

        <button class="quest" data-xp="10">Read Tutorial</button>
        <button class="quest" data-xp="25">Build Mini Project</button>
        <button class="quest" data-xp="50">Overcome Coding Challenge</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
